
name: Build 8Ball Assist APK

on:
  workflow_dispatch:
  push:
    paths:
      - '8BallAssist-Ready.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q 8BallAssist-Ready.zip -d extracted
          PROJECT_DIR="$(find extracted -name settings.gradle.kts -print -quit | xargs dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: 8Ball-Assist-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
